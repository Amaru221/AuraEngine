[package]
name = "aura"
version = "1.1.2"
edition = "2024"
description = "Aura Engine - native live wallpaper manager for Windows"
authors = ["Amaru221 and contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Amaru221/AuraEngine"
homepage = "https://github.com/Amaru221/AuraEngine"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "=0.31.1"
image = "0.25.10"
log = "0.4.34"
open = "5.4.5"
parking_lot = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.1"
sha2 = "0.11.1"
simplelog = "0.12.2"
urlencoding = "2.1.3"
walkdir = "2.5.0"
winreg = "0.56.0"
tray-icon = "0.26.1"
global-hotkey = "0.9.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
]}
raw-window-handle = "0.6"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
